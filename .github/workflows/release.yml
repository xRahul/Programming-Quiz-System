name: Release

# Pinned by major tag (choice: resilient to upstream patch releases;
# SHAs of pinned majors at time of writing:
#   actions/checkout v4 = 11d5960a326750d5838078e36cf38b85af677262)
#
# Trigger A: push to master/main -> rolling `latest` prerelease (upsert).
# Trigger B: push of a v* tag     -> stable GitHub Release.
on:
  push:
    branches: [master, main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  rolling-prerelease:
    name: Rolling prerelease (latest)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    steps:
      - uses: actions/checkout@v7

      - name: Build release artifact
        run: |
          zip -qr artifact.zip quiz_system_git \
            -x "quiz_system_git/tests/*" \
            -x "quiz_system_git/vendor/*" \
            -x "quiz_system_git/phpunit.xml" \
            -x "quiz_system_git/composer.lock" \
            -x "quiz_system_git/.phpunit.result.cache"
          sha256sum artifact.zip > artifact.zip.sha256

      - name: Publish rolling prerelease (tag `latest`)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upsert semantics: drop the old release+tag, then re-create at the
          # current SHA. Chosen over softprops/action-gh-release because the
          # delete-and-recreate flow has fully deterministic behaviour and
          # needs no third-party action.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest artifact.zip artifact.zip.sha256 \
            --prerelease \
            --title "Latest development build" \
            --notes "Development build ${GITHUB_SHA:0:7} ($(date -u +%Y-%m-%d)). Rebuilt automatically on every push to master/main."

  stable-release:
    name: Stable release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Build release artifact
        run: |
          zip -qr artifact.zip quiz_system_git \
            -x "quiz_system_git/tests/*" \
            -x "quiz_system_git/vendor/*" \
            -x "quiz_system_git/phpunit.xml" \
            -x "quiz_system_git/composer.lock" \
            -x "quiz_system_git/.phpunit.result.cache"
          sha256sum artifact.zip > artifact.zip.sha256

      - name: Extract changelog section for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Matches a "## [<version>]" top-level CHANGELOG.md heading and
          # captures everything until the next top-level heading.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 {flag = 1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'Release %s. See CHANGELOG.md for details.\n' "$GITHUB_REF_NAME" > release-notes.md
          fi

      - name: Create stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifact.zip artifact.zip.sha256 \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
